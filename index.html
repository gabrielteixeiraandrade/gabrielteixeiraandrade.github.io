<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protótipo de Site/App de organização de gôndolas</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        /* Container onde a câmera vai aparecer */
        #reader {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        #resultado {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>

    <h1>Escanear Código de Barras</h1>
    
    <div id="reader"></div>
    
    <div id="resultado">Aguardando leitura...</div>

    <script>
        // Quando a leitura for bem-sucedida
        function onScanSuccess(decodedText, decodedResult) {
            // Mostra o resultado na tela
            document.getElementById('resultado').innerText = "Código de Barras Lido: " + decodedText;
            
            // Opcional: Se for um link, você pode redirecionar o usuário:
            // window.location.href = decodedText;

            // Para parar o scanner após ler uma vez, descomente a linha abaixo:
             html5QrcodeScanner.clear();
        }

        // Quando houver erro de leitura (geralmente ignora, pois ele tenta ler a cada milissegundo)
        function onScanFailure(error) {
            // console.warn(`Erro na leitura: ${error}`);
        }

        // Configura o scanner
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", // ID do elemento HTML acima
            { 
                fps: 10,       // Quadros por segundo (velocidade)
                qrbox: { width: 250, height: 250 } // Tamanho do quadrado de foco
            }, 
            /* verbose= */ false
        );

        // Inicializa o leitor
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>

</body>
</html>
